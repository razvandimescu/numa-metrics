# Laptop-side visualization stack. Prometheus scrapes the numa-metrics agent
# (reached over the SSH tunnel, forwarded to the host's :9353); Grafana reads
# Prometheus. Start the tunnel first:
#   ssh -N -L 9353:127.0.0.1:9353 pi-dns-remote
# then: docker compose up -d   ->   Grafana at http://localhost:3000
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: numa-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # so the container can reach the tunnel on the host
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: numa-grafana
    depends_on: [prometheus]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
